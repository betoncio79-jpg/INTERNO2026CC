<nav>
  <a (click)="goTo('home')">Home</a>
  <a (click)="goTo('warehouse')">Bodegas</a>
  <a (click)="goTo('stand')">Estanterías</a>
  <a (click)="goTo('tools')">Herramientas</a>
  <a (click)="goTo('tool-search')">Buscar</a>
</nav>

<div class="toolbar">
  <button class="back-button" (click)="goBack()">‹ Regresar</button>
</div>

<div id="container">
  <div id="login">
    <form [formGroup]="myForm">
      <label>Nombre de la estantería</label>
      <input formControlName="stand_name" type="text" placeholder="Ej: Estanteria_01">
      <br>
      <label>Bodega</label>
      <select formControlName="warehouse_id">
        <option value="" disabled selected>Selecciona una bodega</option>
        @for (warehouse of warehouses; track warehouse.id) {
          <option [value]="warehouse.id">Bodega_0{{ warehouse.numero }} — {{ warehouse.nombre }}</option>
        }
      </select>
      <br>
    </form>
    <button class="save-button" (click)="guardar()">Guardar</button>
  </div>
</div>
